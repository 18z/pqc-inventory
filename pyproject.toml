[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-inventory"
version = "0.1.2"
description = "Defensive static scanner for cryptographic asset inventory and quantum-risk flags"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PQC Inventory" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pqc-inventory = "pqc_inventory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pqc_inventory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
