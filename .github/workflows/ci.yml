name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  scan:
    name: CLI smoke scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Scan sample app (demo, do not fail on intentional highs)
        run: |
          mkdir -p out
          pqc-inventory scan samples/vulnerable-app --out out --fail-on never
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pqc-inventory-demo
          path: out/
          if-no-files-found: error
